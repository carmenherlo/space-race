  - emoji: "🐄"
    text: "Una vaca saltó por encima de la Luna."
    answer: "Falso"
    wrong: ["Verdadero"]
    note: "¡Eso solo pasa en las canciones!"
    level: very_easy
  # ---------- easy: the little ones (the funny wrong answers help them) ----------
  - emoji: "🌍"
    text: "¿En qué planeta vivimos?"
    answer: "La Tierra"
    wrong: ["Marte", "La Luna", "Júpiter"]
  - emoji: "☀️"

# Space Race (the original board): a template, not shown in the menu.
# To play it, copy this folder to /data/games/space-race/ with its board.webp.
#
# A game is a folder in /data/games with this file and, optionally, the board picture:
#   /data/games/space-race/game.yaml    (this file; the folder's name is the game's id)
#   /data/games/space-race/board.webp   (the picture, 16:9, e.g. 1920x1080; see "image")
# After editing it, restart the app (docker compose restart).
# A mistake here only disables this game: the others still work.
#
# Texts IN QUOTES: some have a colon (:), which YAML would misread without them.

# Name shown when choosing who plays.
title: "Space Race"

# The board picture, in this folder. Without it (as in this example), the game draws a
# plain board with numbered dots, still playable.
# image: board.webp

# A voice reads the cards aloud, and the questions and their answers in «Sabelotodo», for
# those who cannot read yet (natural or robot; 🔊 in the game changes it). Optional.
voice: true

# Where every place is on the picture: [x, y] in % of its width and height.
# In order: the start, squares 1, 2, 3, … and the goal (the last one, the Moon).
# They match the household's Space Race board; another board needs its own.
places:
  - [11.5, 35.2]  # start ("Start here")
  - [20.6, 33.5]  # 1
  - [28.8, 33.5]  # 2
  - [35.9, 40.7]  # 3
  - [31.3, 51.1]  # 4
  - [22.7, 51.1]  # 5
  - [14.0, 51.1]  # 6
  - [6.3, 59.3]   # 7
  - [5.7, 73.3]   # 8
  - [11.5, 85.2]  # 9
  - [19.8, 85.2]  # 10
  - [26.9, 79.3]  # 11
  - [31.9, 67.2]  # 12
  - [40.4, 67.8]  # 13
  - [45.3, 80.9]  # 14
  - [52.1, 84.3]  # 15
  - [54.4, 69.8]  # 16
  - [54.4, 54.3]  # 17
  - [56.2, 39.4]  # 18
  - [64.2, 33.5]  # 19
  - [72.8, 33.5]  # 20
  - [82.0, 33.5]  # 21
  - [88.8, 41.5]  # 22
  - [86.2, 55.9]  # 23
  - [77.8, 58.0]  # 24
  - [69.1, 60.2]  # 25
  - [65.0, 72.2]  # 26
  - [69.1, 84.3]  # 27
  - [78.3, 84.8]  # 28
  - [90.4, 79.6]  # the Moon (goal)

# The rules of a turn:
#   1. Roll the die and do what your square says. Only squares reached with the die count
#      (the meteorites' roll too): where a trip sends you does nothing (so 7 and 11 never loop).
#   2. Then, if the turn ends further on than it started, depending on the mode: nothing
#      ("Carrera"), a challenge ("Retos locos") or a question ("Sabelotodo"). Ending
#      level or further back (the black hole, the meteorites, a UFO back…) or missing
#      the next turn (the party): nothing.
#
# What happens on the special squares (the pictures on the board), by square number.
#   kind:  good or bad (the colour of the card)
#   emoji, title, text: what the card shows
#   How it moves you (one of them, or none):
#     go_to: jump to that square (0 = the start, the last place = the goal: you win)
#     move: squares forward (+) or back (−)
#     back_roll: true → roll the die and go back that many squares
#   again: true → roll again (like the Game of the Goose); the challenge comes where
#          the new roll lands
#   skip: true → miss the next turn (or a number: skip: 2 → miss the next 2 turns)
squares:
  # Galaxies, every 5 squares: "de galaxia a galaxia… ¡y viajo con magia!". They take you
  # to the next galaxy (then a challenge); the last one (25) is asleep: it takes you
  # nowhere, the Moon is reached on foot. No extra roll: with
  # galaxies every 5, a 5 would chain them and cross the board in one turn.
  5:
    kind: good
    emoji: "🌌"
    title: "De galaxia a galaxia…"
    text: "…¡y viajo con magia! Su magia te lleva hasta la galaxia de la casilla 10."
    go_to: 10
  10:
    kind: good
    emoji: "🌌"
    title: "De galaxia a galaxia…"
    text: "…¡y viajo con magia! Su magia te lleva hasta la galaxia de la casilla 15."
    go_to: 15
  15:
    kind: good
    emoji: "🌌"
    title: "De galaxia a galaxia…"
    text: "…¡y viajo con magia! Su magia te lleva hasta la galaxia de la casilla 20."
    go_to: 20
  20:
    kind: good
    emoji: "🌌"
    title: "De galaxia a galaxia…"
    text: "…¡y viajo con magia! Su magia te lleva hasta la galaxia de la casilla 25."
    go_to: 25
  25:
    kind: good
    emoji: "😴"
    title: "¡Galaxia dormida!"
    text: "Esta galaxia está echando la siesta y no te lleva a ninguna parte. ¡Shhh! A la Luna tendrás que llegar tú solito."

  # Trips: you travel, then a challenge where you arrive.
  7:
    kind: good
    emoji: "🛸"
    title: "¡Abducción!"
    text: "¡Unos ovnis te han abducido! Te sueltan en un bosque de nubes y aterrizas de culete en la casilla 11."
    go_to: 11
  11:
    kind: bad
    emoji: "👽"
    title: "¡Botón equivocado!"
    text: "Un marciano despistado pulsa el botón que no era y su ovni te manda de vuelta al ovni de la casilla 7."
    go_to: 7
  18:
    kind: good
    emoji: "🛰️"
    title: "¡Héroe espacial!"
    text: "Te quedas arreglando un satélite averiado y te dan una medalla de honor. Avanza hasta la casilla 21."
    go_to: 21

  # Punishments: they usually leave you behind, so the turn ends without a challenge.
  13:
    kind: bad
    emoji: "☄️"
    title: "¡Zona de meteoritos!"
    text: "Te cruzas con una lluvia de meteoritos y tienes que esquivarlos marcha atrás. Tira el dado y retrocede lo que salga."
    back_roll: true
  17:
    kind: bad
    emoji: "🕳️"
    title: "¡Agujero negro!"
    text: "Un agujero negro te absorbe, te da tres vueltas y te escupe… ¡en la salida! Vuelves a empezar. Jijiji."
    go_to: 0
  24:
    kind: bad
    emoji: "🥳"
    title: "¡Fiesta en la base!"
    text: "En la base espacial te encuentras a unos amigos de hace mucho tiempo y montáis una fiesta. Pierdes el próximo turno."
    skip: true

# The challenges: at the end of every turn (except after a punishment), something
# funny to do in front of everybody.
# They come from one shuffled deck for everybody: none repeats until all have come out.
challenges:
  - { emoji: "🥬", text: "Pon cara de lechuga hasta que alguien se ría." }
  - { emoji: "🗿", text: "Quédate quieto como una estatua hasta que todos digan «¡ya!»." }
  - { emoji: "🐵", text: "Pon cara de mono hasta que alguien se ría." }
  - { emoji: "🐟", text: "Pon cara de pez y mira a los ojos a alguien hasta que uno de los dos se ría." }
  - { emoji: "😐", text: "Mira muy serio a todos: el primero que se ría, ¡pierde!" }
  - { emoji: "🤪", text: "Haz la cara más rara que sepas hasta que alguien se ría." }
  - { emoji: "🐷", text: "Haz de cerdito espacial («¡oink, oink!») hasta que alguien se ría." }
  - { emoji: "🤖", text: "Baila como un robot hasta que alguien se ría." }
  - { emoji: "🙊", text: "Todos cuentan un chiste malo; tú tienes que aguantar sin reírte." }
  - { emoji: "👃", text: "Tócate la nariz con la lengua… o al menos inténtalo, hasta que alguien se ría." }
  - { emoji: "🧑‍🚀", text: "Quédate flotando como un astronauta sin gravedad hasta que todos digan «¡aterriza!»." }
  - { emoji: "🦩", text: "Aguanta a la pata coja como un flamenco espacial hasta que todos digan «¡ya!»." }
  - { emoji: "🧊", text: "Te has congelado en el espacio: no te muevas hasta que alguien te dé un abrazo para descongelarte." }
  - { emoji: "😴", text: "Hazte el dormido y no te despiertes hasta que alguien te haga reír." }
  - { emoji: "🌟", text: "Ponte en forma de estrella (brazos y piernas abiertos) hasta que todos cuenten hasta 10." }
  - { emoji: "🐶", text: "Imita a un animal sin hablar. Los demás tienen que adivinarlo." }
  - { emoji: "🚗", text: "Haz el ruido de algo (un coche, un tren, una ducha…). Los demás adivinan qué es." }
  - { emoji: "👨‍👩‍👧", text: "Imita a alguien de la familia. Los demás adivinan a quién." }
  - { emoji: "🎬", text: "Haz como que haces algo de cada día (lavarte los dientes, comer sopa…). Los demás adivinan qué es." }
  - { emoji: "👽", text: "Di «hola» como lo diría un extraterrestre. Todos te tienen que contestar igual." }
  - { emoji: "🚀", text: "Cuenta atrás de 10 a 0 y, al llegar a 0, ¡todos saltan como un cohete!" }
  - { emoji: "🪞", text: "Haz el espejo: todos tienen que copiar lo que haces durante 10 segundos." }
  - { emoji: "👏", text: "Inventa un ritmo con palmas. Los demás tienen que repetirlo." }
  - { emoji: "🎤", text: "Canta una canción que todos conozcan. Los demás tienen que seguirla." }
  - { emoji: "🤗", text: "Abrazo de grupo espacial: ¡todos a abrazarse!" }
  - { emoji: "💃", text: "Todos de pie: baile espacial de 10 segundos." }
  - { emoji: "🐸", text: "Salta como una rana hasta la otra punta de la habitación y vuelve." }
  - { emoji: "🌕", text: "Camina como un astronauta en la Luna, a cámara lenta, hasta la puerta y vuelve." }
  - { emoji: "👀", text: "Cierra los ojos y toca la nariz de alguien." }
  - { emoji: "🔢", text: "Di 3 cosas que haya en el espacio. (Para los mayores: 5)." }
  - { emoji: "🔴", text: "Encuentra algo de color rojo en la habitación y tráelo." }
  - { emoji: "🙆", text: "Tócate la cabeza, los hombros, las rodillas y los pies, cada vez más rápido." }

# The questions (mode "Sabelotodo"): at the end of a turn that ends further on than it
# started, a question with four answers to choose from (shuffled each time). The right
# one: roll again. Each player gets questions of their level, from one shuffled deck per
# level for everybody.
#   answer: the right one   ·   wrong: three wrong ones
#   note: optional, a curious fact shown once answered
#   level, from 1 to 4 stars: very_easy (true or false, the littlest ones: answer
#     "Verdadero" or "Falso", and the other one as the only wrong one) · easy (default)
#     · medium (the older kids) · hard (adults)
questions:
  # ---------- very_easy: true or false (the littlest ones) ----------
  - emoji: "☀️"
    text: "El Sol es una estrella."
    answer: "Verdadero"
    wrong: ["Falso"]
    note: "¡La estrella más cercana a nosotros! Por eso la vemos tan grande."
    level: very_easy
  - emoji: "🧀"
    text: "La Luna está hecha de queso."
    answer: "Falso"
    wrong: ["Verdadero"]
    note: "Está hecha de roca y polvo gris. ¡Aunque tenga agujeros como el queso!"
    level: very_easy
  - emoji: "🌍"
    text: "Vivimos en el planeta Tierra."
    answer: "Verdadero"
    wrong: ["Falso"]
    level: very_easy
  - emoji: "🌙"
    text: "La Luna solo se ve de noche, nunca de día."
    answer: "Falso"
    wrong: ["Verdadero"]
    note: "Se ve sobre todo de noche, pero a veces también de día."
    level: very_easy
  - emoji: "🚀"
    text: "Los astronautas viajan al espacio en cohete."
    answer: "Verdadero"
    wrong: ["Falso"]
    level: very_easy
  - emoji: "🐟"
    text: "En el espacio hay peces nadando."
    answer: "Falso"
    wrong: ["Verdadero"]
    note: "En el espacio no hay agua ni aire: los peces no podrían vivir."
    level: very_easy
  - emoji: "⭐"
    text: "Por la noche vemos estrellas en el cielo."
    answer: "Verdadero"
    wrong: ["Falso"]
    level: very_easy
  - emoji: "🪐"
    text: "Saturno tiene anillos."
    answer: "Verdadero"
    wrong: ["Falso"]
    note: "Sus anillos están hechos de trozos de hielo y de roca."
    level: very_easy
  - emoji: "🔴"
    text: "Marte es de color azul."
    answer: "Falso"
    wrong: ["Verdadero"]
    note: "Marte es rojizo: por eso lo llaman el planeta rojo."
    level: very_easy
  - emoji: "🧑‍🚀"
    text: "Los astronautas flotan dentro de la nave."
    answer: "Verdadero"
    wrong: ["Falso"]
    level: very_easy
  - emoji: "🔥"

# Space questions: a question bank, for every game that says "questions: space" (the
# name of this file). Mode "Sabelotodo": a question at the start of every turn; right,
# roll the die. The answers are shuffled each time.
# For people, the same questions: docs/questions-space.md. After editing, restart the app.
#
#   emoji, text: the question
#   answer: the right one   ·   wrong: three wrong ones
#   note: optional, a curious fact shown once answered
#   level, from 1 to 3 stars, chosen for each player before playing:
#     easy   (⭐, the littlest ones) true or false: answer "Verdadero" or "Falso", and the
#            other one as the only wrong one
#     medium (⭐⭐, the kids who read)
#     hard   (⭐⭐⭐, adults)
#
# Texts IN QUOTES: some have a colon (:), which YAML would misread without them.


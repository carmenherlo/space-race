# Space Race Expanded (68 squares and the Moon).
# Example: without a board picture, the game draws a plain board with numbered dots.
# With yours, put it in this folder and set "image" (the places below match the
# household's board; another board needs its own).
#
# A game is a folder in /data/games with this file and its board picture; the folder's
# name is the game's id. The avatars to choose from are in /data/games/players/.
# Every field is explained in templates/space-race/game.yaml.
# After editing it, restart the app (docker compose restart).
#
# Texts IN QUOTES: some have a colon (:), which YAML would misread without them.

title: "Space Race Expanded"
# image: board.webp

# The rules of this game:
modes: [race, questions] # "Carrera" or "Sabelotodo" (a question after a turn)
exact_finish: true       # the Moon only with the exact number; overshooting bounces back
backwards_counts: false  # going back (meteorites, storm, bounce, nebula, swap): you just stay there
max_stars: 1             # one wildcard star at a time: with one, square 13 gives no other
voice: true              # a voice reads the cards aloud (the tablet's own; 🔊 turns it off)

# Where every place is on the picture: [x, y] in % of its width and height.
# In order: the start, squares 1 to 68 and the Moon (69).

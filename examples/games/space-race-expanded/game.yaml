# The questions (mode "Sabelotodo"): at the end of a turn that ends further on than it
# started, a question with four answers to choose from (shuffled each time). The right
# one: roll again. Each player gets questions of their level, from one shuffled deck per
# level for everybody.
#   answer: the right one   ·   wrong: three wrong ones
#   note: optional, a curious fact shown once answered
#   level, from 1 to 4 stars: very_easy (true or false, the littlest ones: answer
#     "Verdadero" or "Falso", and the other one as the only wrong one) · easy (default)
#     · medium (the older kids) · hard (adults)
questions:
  # ---------- very_easy: true or false (the littlest ones) ----------
  - emoji: "☀️"
    text: "El Sol es una estrella."

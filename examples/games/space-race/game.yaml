# Space Race (28 squares and the Moon): the short board.
# Example: without a board picture, the game draws a plain board with numbered dots.
# With yours, put it in this folder and set "image".
#
# Every field is explained in templates/space-race/game.yaml.
# After editing it, restart the app (docker compose restart).

# Name shown when choosing who plays.
title: "Space Race"

# image: board.webp

# A voice reads the cards aloud, and the questions and their answers in «Sabelotodo», for
# those who cannot read yet (natural or robot; 🔊 in the game changes it). Optional.
voice: true

# The rules of this game:
# The modes, each with its own rules. exact_finish: the Moon only with the exact number
# (overshooting bounces back); false: overshooting still gets there.
modes:
  race:                  # "Carrera"
    exact_finish: true
  questions:             # "Sabelotodo" (a question every turn)
    exact_finish: false

# Where every place is on the picture: [x, y] in % of its width and height.
# In order: the start, squares 1, 2, 3, … and the goal (the last one, the Moon).
# They match the household's Space Race board; another board needs its own.
places:
  - [11.5, 35.2]  # start ("Start here")
  - [20.6, 33.5]  # 1
  - [28.8, 33.5]  # 2
  - [35.9, 40.7]  # 3
  - [31.3, 51.1]  # 4
  - [22.7, 51.1]  # 5
  - [14.0, 51.1]  # 6
  - [6.3, 59.3]   # 7
  - [5.7, 73.3]   # 8
  - [11.5, 85.2]  # 9
  - [19.8, 85.2]  # 10
  - [26.9, 79.3]  # 11
  - [31.9, 67.2]  # 12
  - [40.4, 67.8]  # 13
  - [45.3, 80.9]  # 14
  - [52.1, 84.3]  # 15
  - [54.4, 69.8]  # 16
  - [54.4, 54.3]  # 17
  - [56.2, 39.4]  # 18
  - [64.2, 33.5]  # 19
  - [72.8, 33.5]  # 20
  - [82.0, 33.5]  # 21
  - [88.8, 41.5]  # 22
  - [86.2, 55.9]  # 23
  - [77.8, 58.0]  # 24
  - [69.1, 60.2]  # 25
  - [65.0, 72.2]  # 26
  - [69.1, 84.3]  # 27
  - [78.3, 84.8]  # 28
  - [90.4, 79.6]  # the Moon (goal)

# "Carrera": roll the die and do what your square says. Only squares reached with the
# die count (the meteorites' roll too): where a trip sends you does nothing (so 7 and 11
# never loop). "Sabelotodo": a question first; right, roll and move (the squares do
# nothing); wrong, you stay where you are.
#
# What happens on the special squares (the pictures on the board), by square number.
#   kind:  good or bad (the colour of the card)
#   emoji, title, text: what the card shows
#   How it moves you (one of them, or none):
#     go_to: jump to that square (0 = the start, the last place = the goal: you win)
#     move: squares forward (+) or back (−)
#     back_roll: true → roll the die and go back that many squares
#   again: true → roll again (like the Game of the Goose)
#   skip: true → miss the next turn (or a number: skip: 2 → miss the next 2 turns)
squares:
  # Galaxies, every 5 squares: "de galaxia a galaxia… ¡y viajo con magia!". They take you
  # to the next galaxy; the last one (25) is asleep: it takes you
  # nowhere, the Moon is reached on foot. No extra roll: with
  # galaxies every 5, a 5 would chain them and cross the board in one turn.
  5:
    kind: good
    emoji: "🌌"
    title: "De galaxia a galaxia…"
    text: "…¡y viajo con magia! Su magia te lleva hasta la galaxia de la casilla 10."
    go_to: 10
  10:
    kind: good
    emoji: "🌌"
    title: "De galaxia a galaxia…"
    text: "…¡y viajo con magia! Su magia te lleva hasta la galaxia de la casilla 15."
    go_to: 15
  15:
    kind: good
    emoji: "🌌"
    title: "De galaxia a galaxia…"
    text: "…¡y viajo con magia! Su magia te lleva hasta la galaxia de la casilla 20."
    go_to: 20
  20:
    kind: good
    emoji: "🌌"
    title: "De galaxia a galaxia…"
    text: "…¡y viajo con magia! Su magia te lleva hasta la galaxia de la casilla 25."
    go_to: 25
  25:
    kind: good
    emoji: "😴"
    title: "¡Galaxia dormida!"
    text: "Esta galaxia está echando la siesta y no te lleva a ninguna parte. ¡Shhh! A la Luna tendrás que llegar tú solito."

  # Trips.
  7:
    kind: good
    emoji: "🛸"
    title: "¡Abducción!"
    text: "¡Unos ovnis te han abducido! Te sueltan en un bosque de nubes y aterrizas de culete en la casilla 11."
    go_to: 11
  11:
    kind: bad
    emoji: "👽"
    title: "¡Botón equivocado!"
    text: "Un marciano despistado pulsa el botón que no era y su ovni te manda de vuelta al ovni de la casilla 7."
    go_to: 7
  18:
    kind: good
    emoji: "🛰️"
    title: "¡Héroe espacial!"
    text: "Te quedas arreglando un satélite averiado y te dan una medalla de honor. Avanza hasta la casilla 21."
    go_to: 21

  # Punishments.
  13:
    kind: bad
    emoji: "☄️"
    title: "¡Zona de meteoritos!"
    text: "Te cruzas con una lluvia de meteoritos y tienes que esquivarlos marcha atrás. Tira el dado y retrocede lo que salga."
    back_roll: true
  17:
    kind: bad
    emoji: "🕳️"
    title: "¡Agujero negro!"
    text: "Un agujero negro te absorbe, te da tres vueltas y te escupe… ¡en la salida! Vuelves a empezar. Jijiji."
    go_to: 0
  24:
    kind: bad
    emoji: "🥳"
    title: "¡Fiesta en la base!"
    text: "En la base espacial te encuentras a unos amigos de hace mucho tiempo y montáis una fiesta. Pierdes el próximo turno."
    skip: true

# The questions (mode "Sabelotodo"): from the shared bank questions/space.yaml (next to
# the games folder; the levels and every field are explained there).
questions: space

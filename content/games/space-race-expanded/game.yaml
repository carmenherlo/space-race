# Space Race Expanded (68 squares and the Moon).
# The full rules, for people: docs/rules.md.
# The board, board.webp, is 1920x1080.
#
# Every field is explained in docs/game-yaml.md.
# After editing it, restart the app (docker compose restart).
#
# Texts IN QUOTES: some have a colon (:), which YAML would misread without them.

title: "Space Race Expanded"
image: board.webp

# The rules of this game:
# The modes, each with its own rules. exact_finish: the Moon only with the exact number
# (overshooting bounces back); false: overshooting still gets there.
modes:
  race:                  # "Carrera"
    exact_finish: true
  questions:             # "Sabelotodo" (a question every turn)
    exact_finish: false
backwards_counts: true   # going back (meteorites, bounce): the square you land on counts
max_stars: 1             # one wildcard star at a time: with one, square 13 gives no other
voice: true              # a voice reads the cards aloud (the tablet's own; 🔊 turns it off)

# Where every place is on the picture: [x, y] in % of its width and height.
# In order: the start, squares 1 to 68 and the Moon (69).

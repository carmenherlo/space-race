# The special squares, by number: which type each one is (content/games/square-types.yaml,
# shared by every board: the card and what it does) and, for a trip, where to (go_to).
# Anything else written here wins over the type. Only squares reached with the die count:
# where a trip sends you does nothing, so trips never loop.
squares:
  # Galaxies: to the next one, and roll again. The last one (65): a minigame.
  6:  { type: galaxy_again, go_to: 11 }
  11: { type: galaxy_again, go_to: 15 }
  15: { type: galaxy_again, go_to: 20 }
  20: { type: galaxy_again, go_to: 24 }
  24: { type: galaxy_again, go_to: 29 }
  29: { type: galaxy_again, go_to: 33 }
  33: { type: galaxy_again, go_to: 38 }
  38: { type: galaxy_again, go_to: 42 }
  42: { type: galaxy_again, go_to: 47 }
  47: { type: galaxy_again, go_to: 51 }
  51: { type: galaxy_again, go_to: 56 }
  56: { type: galaxy_again, go_to: 60 }
  60: { type: galaxy_again, go_to: 65 }
  65: { type: last_galaxy, trail: [[79.5, 85.5], [82.0, 84.0], [84.2, 81.5], [85.8, 78.0], [87.5, 74.5]] }  # the star trail to the Moon (% of the picture)

  # Trips, both ways.
  9:  { type: wormhole, go_to: 22 }
  22: { type: wormhole_back, go_to: 9 }
  8:  { type: abduction, go_to: 27 }
  27: { type: abduction_back, go_to: 8 }
  41: { type: abduction, go_to: 55 }
  55: { type: abduction_back, go_to: 41 }
  44: { type: nebula, go_to: 30 }

  # The rest.
  3:  { type: boost }
  13: { type: star }
  17: { type: solar_storm }
  23: { type: meteorites }
  36: { type: space_station }
  49: { type: spy_satellite }
  52: { type: party, skip: 2 }  # the party lasts 2 turns here
  58:  # back to 31, not to the start
    type: black_hole
    go_to: 31
    text: "Un agujero negro te absorbe, te da tres vueltas y te escupe… ¡en la casilla {to}! Jijiji."

# The questions (mode "Sabelotodo"): from the shared bank content/questions/general.yaml

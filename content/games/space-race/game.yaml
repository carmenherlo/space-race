# Space Race (28 squares and the Moon): the short board.
# Its rules, for people: rules.md (next to this file); for every board: ../general-rules.md.
# The board, board.webp, is 1920x1080.
#
# Every field is explained in docs/game-yaml.md.
# After editing it, restart the app (docker compose restart).

# Name shown when choosing who plays.
title: "Space Race"

image: board.webp
# The board's lights, in lights/, each file named after its part (lights/moon_full.png,
# the whole Moon, is a drawing kept for later: nothing uses it).
squares_image: lights/squares.png  # only the squares: to light up the one a token is on
# Parts of the board that light up (the same size as the board, the rest see-through).
lights:
  title: lights/title.png
  start: lights/start.png
  trail: lights/trail.png
  moon: lights/moon.png
  moon_sign: lights/moon_sign.png
  moon_flags: lights/moon_flags.png
  moon_stars: lights/moon_stars.png
# The rocket that brings each token to the start, drawn where it stops (the same size).
rocket: lights/rocketship_position.png

# A voice reads the cards aloud, and the questions and their answers in «Sabelotodo», for
# those who cannot read yet (natural or robot; 🔊 in the game changes it). Optional.
voice: true

# The rules of this game:
# The modes, each with its own rules. exact_finish: the Moon only with the exact number
# (overshooting bounces back); false: overshooting still gets there.
modes:
  race:                  # "Carrera"
    exact_finish: true
  questions:             # "Sabelotodo" (a question every turn)
    exact_finish: true
backwards_counts: true   # going back (meteorites, bounce): the square you land on counts
max_stars: 1             # one wildcard star at a time: with one, square 14 gives no other

# Where every place is on the picture: [x, y] in % of its width and height.
# In order: the start, squares 1, 2, 3, … and the goal (the last one, the Moon).
# They match the household's Space Race board; another board needs its own.
# At the start, the others wait on the rocket, over "Start here" (so the sign shows).
waiting_place: [9, 22]

places:
  - [9.6, 32.8]   # start: whose turn it is, on "Start here" (where the rocket drops it)
  - [20.6, 33.5]  # 1
  - [28.8, 33.5]  # 2
  - [35.9, 40.7]  # 3
  - [31.3, 51.1]  # 4
  - [22.7, 51.1]  # 5
  - [14.0, 51.1]  # 6
  - [6.3, 59.3]   # 7
  - [5.7, 73.3]   # 8
  - [11.5, 85.2]  # 9
  - [19.8, 85.2]  # 10
  - [26.9, 79.3]  # 11
  - [31.9, 67.2]  # 12
  - [40.4, 67.8]  # 13
  - [45.3, 80.9]  # 14
  - [52.1, 84.3]  # 15
  - [54.4, 69.8]  # 16
  - [54.4, 54.3]  # 17
  - [56.2, 39.4]  # 18
  - [64.2, 33.5]  # 19
  - [72.8, 33.5]  # 20
  - [82.0, 33.5]  # 21
  - [88.8, 41.5]  # 22
  - [86.2, 55.9]  # 23
  - [77.8, 58.0]  # 24
  - [69.1, 60.2]  # 25
  - [65.0, 72.2]  # 26
  - [69.1, 84.3]  # 27
  - [78.3, 84.8]  # 28
  - [90.4, 79.6]  # the Moon (goal)

# The special squares, by number: which type each one is (content/games/square-types.yaml,
# shared by every board: the card and what it does) and, for a trip, where to (go_to).
# Anything else written here wins over the type. Only squares reached with the die count:
# where a trip sends you does nothing, so trips never loop.
squares:
  # Galaxies, every 5 squares: to the next one. No extra roll: with galaxies every 5, a 5
  # would chain them and cross the board in one turn. The last one: a minigame.
  5:  { type: galaxy, go_to: 10 }
  10: { type: galaxy, go_to: 15 }
  15: { type: galaxy, go_to: 20 }
  20: { type: galaxy, go_to: 25 }
  25: { type: last_galaxy, trail: [[72.2, 67.5], [76.3, 71.8], [80.2, 73.8], [84.0, 75.5]] }  # the star trail to the Moon (% of the picture)

  # Trips, both ways.
  4:  { type: wormhole, go_to: 12 }
  12: { type: wormhole_back, go_to: 4 }
  7:  { type: abduction, go_to: 11 }
  11: { type: abduction_back, go_to: 7 }
  18: { type: space_hero, go_to: 21 }
  23: { type: nebula, go_to: 19 }

  # The rest.
  2:  { type: boost }
  13: { type: meteorites }
  14: { type: star }
  16: { type: black_hole }
  17: { type: spy_satellite }
  22: { type: solar_storm }
  24: { type: party }

# The questions (mode "Sabelotodo"): from the shared bank content/questions/general.yaml
# (the levels and every field are explained there).
questions: general

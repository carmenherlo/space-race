# General knowledge questions: a question bank, for every game that says
# "questions: general" (the name of this file). Mode "Sabelotodo": a question at the
# start of every turn; right, roll the die. The answers are shuffled each time.
# For people, the same questions: docs/questions-general.md. After editing, restart the app.
#
# Levels easy, medium and hard: translated and adapted from Open Trivia Database (https://opentdb.com),
# licensed CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/).
#
#   emoji, text: the question
#   answer: the right one   ·   wrong: three wrong ones
#   note: optional, a curious fact shown once answered
#   level, chosen for each player before playing:
#     very_easy (🐣, about 4 years old) true or false, often silly: answers as in easy
#     easy   (⭐) true or false: answer "Verdadero" or "Falso", and the other one as the
#            only wrong one
#     medium (⭐⭐)
#     hard   (⭐⭐⭐)
#
# Texts IN QUOTES: some have a colon (:), which YAML would misread without them.


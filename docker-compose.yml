# Run: docker compose up -d --build  →  http://localhost:8100
# Before the first run: cp -r examples/games examples/questions examples/avatars data/  (then add your board picture and avatars)
services:
  space-race:
    build: .
    image: space-race:local
    ports:
      - "8100:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped

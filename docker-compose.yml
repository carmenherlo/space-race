# Run: docker compose up -d --build  →  http://localhost:8100
# data/ holds your avatars (data/avatars/); the games come with the image (content/).
services:
  space-race:
    build: .
    image: space-race:local
    ports:
      - "8100:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped

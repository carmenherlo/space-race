<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luces del tablero</title>
  <!-- A test page (in the menu, under "Pruebas"): lights on the board's own drawings. -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="pruebas.css">
  <link rel="stylesheet" href="dado.css">
  <link rel="stylesheet" href="luces.css">
  <script type="module" src="luces.js"></script>
</head>
<body class="galaxy">
  <a class="close-x galaxy__close" href="../games.html" aria-label="Salir">✕</a>
  <main class="galaxy__main dice-test">
    <!-- Each light can be switched off; the die, the last galaxy and back to the start. -->
    <div class="dice-test__ideas">
      <label><input type="checkbox" id="light-title" checked> Título</label>
      <label><input type="checkbox" id="light-start" checked> Start</label>
      <label><input type="checkbox" id="light-trail" checked> Estela</label>
      <label><input type="checkbox" id="light-arrive" checked> Llega</label>
      <label><input type="checkbox" id="light-near" checked> Cerca</label>
      <button class="dice-test__die" id="die" type="button" aria-label="Tirar el dado">🎲</button>
      <button class="galaxy__button" id="galaxy" type="button" aria-label="Última galaxia">🌌</button>
      <button class="galaxy__button" id="reset" type="button" aria-label="A la salida">↺</button>
    </div>
    <div class="dice-test__board" id="board">
      <img class="dice-test__image" id="board-image" alt="">
    </div>
  </main>
</body>
</html>

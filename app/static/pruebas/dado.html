<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El dado</title>
  <!-- A test page (in the menu, under "Pruebas"): ideas so a roll is easy to follow. -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="pruebas.css">
  <link rel="stylesheet" href="dado.css">
  <script type="module" src="dado.js"></script>
</head>
<body class="galaxy">
  <a class="close-x galaxy__close" href="../games.html" aria-label="Salir">✕</a>
  <main class="galaxy__main dice-test">
    <!-- The ideas to see (they can be combined), and the die. -->
    <div class="dice-test__ideas">
      <label><input type="checkbox" id="idea-pulse" checked> Latido</label>
      <label><input type="checkbox" id="idea-pulse-shine"> …al brillar</label>
      <label><input type="checkbox" id="idea-roll-hops" checked> Salta</label>
      <label><input type="checkbox" id="idea-number" checked> 1. Número</label>
      <label>2.
        <select id="idea-find">
          <option value="none">Nada</option>
          <option value="hops">Dos saltitos</option>
          <option value="shine">Brillo</option>
        </select>
      </label>
      <label><input type="checkbox" id="idea-slow" checked> 3. Lento</label>
      <button class="dice-test__die" id="die" type="button" aria-label="Tirar el dado">🎲</button>
    </div>
    <div class="dice-test__board" id="board">
      <img class="dice-test__image" id="board-image" alt="">
      <span class="dice-test__number" id="number" hidden></span>
    </div>
  </main>
</body>
</html>

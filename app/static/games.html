<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juegos</title>
  <!-- Relative paths, so it also works behind a proxy under a sub-path. -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/games.css">
  <script type="module" src="js/games.js"></script>
</head>
<body class="games">
  <p class="status" id="status" role="status" hidden></p>

  <!-- Every board game in content/games (one folder each): a tap opens it in game.html. -->
  <main class="games__main">
    <h1 class="games__title">🎲 Juegos</h1>
    <ul class="games__list" id="games"></ul>

    <!-- Test pages (pruebas/): ideas to try out before they go into a game. -->
    <h2 class="games__subtitle">🧪 Pruebas</h2>
    <ul class="games__tests">
      <li><a class="games__test" href="pruebas/galaxia.html">🌌 La última galaxia <small>minijuegos para ir a la Luna</small></a></li>
      <li><a class="games__test" href="pruebas/celebracion.html">🎉 Celebración <small>cuando alguien gana</small></a></li>
      <li><a class="games__test" href="pruebas/dado.html">🎲 El dado <small>para seguir bien cada tirada</small></a></li>
    </ul>
  </main>

  <template id="game-template">
    <li>
      <a class="game-card">
        <span class="game-card__picture"></span>
        <span class="game-card__title"></span>
        <span class="game-card__problem" hidden>Tiene un error: revisa su game.yaml</span>
      </a>
    </li>
  </template>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space Race</title>
  <style>
    html, body { height: 100%; margin: 0; background: #0b1026; overflow: hidden; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <!-- The app's frame: every page (menu, game, tests) opens inside it, so going from one to
       another keeps the full screen, which the browser drops on leaving a page.
       js/fullscreen.js fills the screen with this page, not with the one inside. -->
  <iframe id="page" src="games.html" title="Space Race" allow="fullscreen; autoplay"></iframe>
  <script>
    window.spaceRaceFrame = true;
    const page = document.getElementById("page");
    page.addEventListener("load", () => {
      document.title = page.contentDocument?.title || "Space Race";
      addRemote(page.contentDocument);
    });

    // TV remote (remote/remote.js): added to every page opened here, kept apart from them.
    // The page gets the keyboard focus, so the remote's arrows reach it.
    function addRemote(doc) {
      if (!doc) {
        return;
      }
      const script = doc.createElement("script");
      script.type = "module";
      script.src = new URL("remote/remote.js", location.href).href;
      doc.head.append(script);
      page.contentWindow.focus();
    }
  </script>
</body>
</html>
